<div class="dialog-backdrop" role="presentation">
  <section class="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="obs-password-title">
    <header class="dialog-header">
      <h2 id="obs-password-title">OBS WebSocket Password</h2>
      <button class="dialog-icon-button" type="button" aria-label="Close" title="Close" (click)="cancelled.emit()">
        <span aria-hidden="true">x</span>
      </button>
    </header>

    <label class="dialog-field">
      <span>Password</span>
      <input #passwordInput type="password" autocomplete="current-password" [disabled]="isSubmitting" />
    </label>

    <label class="dialog-check">
      <input #rememberInput type="checkbox" [disabled]="isSubmitting" />
      <span>Remember password on this device</span>
    </label>

    @if(errorMessage) {
    <p class="dialog-error">{{ errorMessage }}</p>
    }

    <footer class="dialog-actions">
      <button class="dialog-button" type="button" [disabled]="isSubmitting" (click)="cancelled.emit()">Cancel</button>
      <button class="dialog-button dialog-button-primary" type="button" [disabled]="isSubmitting"
        (click)="submit(passwordInput.value, rememberInput.checked)">
        {{ isSubmitting ? 'Connecting...' : 'Connect' }}
      </button>
    </footer>
  </section>
</div>
